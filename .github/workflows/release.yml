name: Release Maqistor

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        name: Verify the tag matches the binary version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "maqistor") | .version')"

          test "$tag_version" = "$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        run: cargo test --workspace --locked

  build-unix-binary:
    needs: [verify-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: maqistor-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: maqistor-linux-aarch64.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: maqistor-macos-x86_64.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: maqistor-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release -p maqistor --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release \
            -czf dist/${{ matrix.asset }} maqistor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-windows-binary:
    needs: [verify-version, test]
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      ASSET: maqistor-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --locked --release -p maqistor --target $env:TARGET

      - name: Create release archive
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path "target\$env:TARGET\release\maqistor.exe" `
            -DestinationPath "dist\$env:ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  publish-container:
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/lghtr35/maqistor

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  create-github-release:
    needs:
      - verify-version
      - build-unix-binary
      - build-windows-binary
      - publish-container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maqistor-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum maqistor-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
