[workspace]
resolver = "2"
members = [
    "crates/maqistor",
    "crates/api",
    "crates/dispatcher",
    "crates/engine",
    "crates/persistence",
    "crates/types",
    "crates/worker-protocol",
    "crates/worker-sdk",
    "crates/client-sdk",
    "benchmark/noop-worker",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lghtr35/maqistor"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
maqistor-api = { path = "crates/api" }
maqistor-dispatcher = { path = "crates/dispatcher" }
maqistor-engine = { path = "crates/engine" }
maqistor-persistence = { path = "crates/persistence" }
maqistor-types = { path = "crates/types" }
maqistor-client-sdk = { path = "crates/client-sdk" }

# External crates
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bollard = { version = "0.18", features = ["aws-lc-rs"] }
chrono = "0.4"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
humantime = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_cbor = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
